<div class="fixed inset-0 bg-black bg-opacity-50 hidden items-start md:items-center justify-center z-50 overflow-y-auto" id="clientModal">
<div class="bg-white dark:bg-dark-card rounded-lg shadow-xl w-[min(95%,56rem)] mx-auto my-8 overflow-hidden">
<div class="px-6 py-4 border-b dark:border-dark-border flex justify-between items-center sticky top-0 bg-white dark:bg-dark-card z-10">
<h3 class="text-lg font-medium" id="clientModalTitle">Add New Client</h3>
<button class="text-gray-400 hover:text-gray-500" onclick="clientsManager.closeModal()">
<i class="fas fa-times"></i>
</button>
</div>
<form class="p-6" id="clientForm">
<input id="clientId" type="hidden"/>
<!-- Basic Info -->
<h4 class="text-md font-semibold mb-4 border-b pb-2">Basic Info</h4>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Company Name *</label>
<input class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-dtech-500 focus:ring-dtech-500 sm:text-sm px-3 py-2 border" id="clientCompany" required="" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Company Reg Number</label>
<input class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-dtech-500 focus:ring-dtech-500 sm:text-sm px-3 py-2 border" id="clientRegNum" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300">VAT Number</label>
<input class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-dtech-500 focus:ring-dtech-500 sm:text-sm px-3 py-2 border" id="clientVatNum" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Industry</label>
<input class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-dtech-500 focus:ring-dtech-500 sm:text-sm px-3 py-2 border" id="clientIndustry" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Website</label>
<input class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-dtech-500 focus:ring-dtech-500 sm:text-sm px-3 py-2 border" id="clientWebsite" type="url"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300">LinkedIn</label>
<input class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-dtech-500 focus:ring-dtech-500 sm:text-sm px-3 py-2 border" id="clientLinkedin" type="url"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Status</label>
<select class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-dtech-500 focus:ring-dtech-500 sm:text-sm px-3 py-2 border" id="clientStatus">
<option value="Active">Active</option>
<option value="Inactive">Inactive</option>
<option value="Archived">Archived</option>
</select>
</div>
</div>
<!-- Addresses -->
<h4 class="text-md font-semibold mb-4 border-b pb-2">Addresses</h4>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Physical Address</label>
<textarea class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-dtech-500 focus:ring-dtech-500 sm:text-sm px-3 py-2 border" id="clientPhysicalAddress" rows="2"></textarea>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Postal Address</label>
<textarea class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-dtech-500 focus:ring-dtech-500 sm:text-sm px-3 py-2 border" id="clientPostalAddress" rows="2"></textarea>
</div>
</div>
<!-- Contacts -->
<h4 class="text-md font-semibold mb-4 border-b pb-2">Contacts</h4>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Primary Contact Person</label>
<input class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-dtech-500 focus:ring-dtech-500 sm:text-sm px-3 py-2 border" id="clientContact" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Primary Email *</label>
<input class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-dtech-500 focus:ring-dtech-500 sm:text-sm px-3 py-2 border" id="clientEmail" required="" type="email"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Primary Phone</label>
<input class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-dtech-500 focus:ring-dtech-500 sm:text-sm px-3 py-2 border" id="clientPhone" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Preferred Contact Method</label>
<select class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-dtech-500 focus:ring-dtech-500 sm:text-sm px-3 py-2 border" id="clientPreferredContact">
<option value="Email">Email</option>
<option value="Phone">Phone</option>
<option value="WhatsApp">WhatsApp</option>
</select>
</div>
<div class="md:col-span-2">
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Billing Contact (Name/Email/Phone)</label>
<input class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-dtech-500 focus:ring-dtech-500 sm:text-sm px-3 py-2 border" id="clientBillingContact" placeholder="e.g. Jane Doe, jane@example.com, +123456789" type="text"/>
</div>
<div class="md:col-span-2">
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Technical Contact (Name/Email/Phone)</label>
<input class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-dtech-500 focus:ring-dtech-500 sm:text-sm px-3 py-2 border" id="clientTechContact" placeholder="e.g. John Smith, john@example.com, +123456789" type="text"/>
</div>
<div class="md:col-span-2">
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Notes</label>
<textarea class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-dtech-500 focus:ring-dtech-500 sm:text-sm px-3 py-2 border" id="clientNotes" rows="3"></textarea>
</div>
</div>
<div class="mt-6 flex justify-end space-x-3 border-t dark:border-dark-border pt-4">
<button class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700" onclick="clientsManager.closeModal()" type="button">Cancel</button>
<button class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-dtech-600 hover:bg-dtech-700" id="saveClientBtn" type="submit">Save Client</button>
</div>
</form>
</div>
</div>
<!-- Client Details Overlay / Slide-in (Hidden) -->
<div class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 overflow-hidden" id="clientDetailsModal">
<div class="absolute inset-y-0 right-0 max-w-full flex">
<div class="w-screen max-w-3xl bg-white dark:bg-dark-card shadow-xl h-full flex flex-col transform transition-transform translate-x-full" id="clientDetailsPanel">
<div class="px-6 py-4 border-b dark:border-dark-border flex justify-between items-center bg-gray-50 dark:bg-gray-800">
<h2 class="text-xl font-semibold" id="detailsCompanyName">Client Details</h2>
<button class="text-gray-400 hover:text-gray-500" onclick="clientsManager.closeDetails()">
<i class="fas fa-times text-xl"></i>
</button>
</div>
<div class="p-6 overflow-y-auto flex-grow" id="clientDetailsContent">
<!-- Dynamic details inserted here -->
</div>
</div>
