name: Diagnose Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  diagnose:
    name: Diagnose Cloudflare Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Cloudflare Credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi

          if [ -z "$CF_ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing."
            exit 1
          fi

          echo "Cloudflare credentials successfully detected."

      - name: Resolve KV Namespace ID
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_ID: ${{ secrets.CLOUDFLARE_KV_ID || vars.CLOUDFLARE_KV_ID || secrets.CF_KV_ID || vars.CF_KV_ID || secrets.DTECH_KV_ID || vars.DTECH_KV_ID }}
        run: |
          if [ -z "$KV_ID" ]; then
            echo "Discovering DTECH_KV namespace..."

            API_RESP=$(curl -sS -w '\n%{http_code}' \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/storage/kv/namespaces?per_page=100" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json")

            HTTP_CODE=$(echo "$API_RESP" | tail -n 1)
            API_BODY=$(echo "$API_RESP" | sed '$d')

            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::Cloudflare KV API returned HTTP $HTTP_CODE"
              echo "$API_BODY" | jq -r '.errors[]?.message // "Unknown API error"'
              exit 1
            fi

            if ! echo "$API_BODY" | jq -e '.success == true' >/dev/null; then
              echo "::error::Cloudflare rejected the KV namespace request."
              echo "$API_BODY" | jq -r '.errors[]?.message'
              exit 1
            fi

            KV_ID=$(echo "$API_BODY" | jq -r \
              '.result[]? | select(.title=="DTECH_KV") | .id' | head -n 1)
          fi

          if [ -n "$KV_ID" ] && [ "$KV_ID" != "null" ]; then
            echo "DTECH_KV namespace resolved."
            sed -i "s/PLACEHOLDER_KV_ID/$KV_ID/g" wrangler.toml
          elif grep -q "PLACEHOLDER_KV_ID" wrangler.toml; then
            echo "::error::DTECH_KV namespace not found."
            exit 1
          else
            echo "Using existing KV configuration."
          fi

      - name: Inspect Project Files
        run: |
          echo "Checking project files..."

          ls -la

          test -f worker.js || {
            echo "::error::worker.js not found."
            exit 1
          }

          test -f wrangler.toml || {
            echo "::error::wrangler.toml not found."
            exit 1
          }

          echo "Project files found."

      - name: Diagnose Wrangler Configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Wrangler version:"
          npx --yes wrangler@3.90.0 --version

          echo "Validating Wrangler configuration..."

          npx --yes wrangler@3.90.0 deploy \
            --dry-run \
            --outdir=./dist

          echo "Wrangler diagnostic completed successfully."