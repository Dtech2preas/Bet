name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate & Clean Credentials
        id: creds
        run: |
          RAW_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || vars.CLOUDFLARE_TOKEN }}"
          RAW_ACCOUNT="${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT || vars.CLOUDFLARE_ACCOUNT }}"
          RAW_KV="${{ secrets.CLOUDFLARE_KV_ID || vars.CLOUDFLARE_KV_ID || secrets.CF_KV_ID || vars.CF_KV_ID || secrets.DTECH_KV_ID || vars.DTECH_KV_ID }}"

          # Clean whitespace and newlines
          TOKEN=$(echo "$RAW_TOKEN" | tr -d '[:space:]"')
          ACCOUNT=$(echo "$RAW_ACCOUNT" | tr -d '[:space:]"')
          KV_ID=$(echo "$RAW_KV" | tr -d '[:space:]"')

          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing or empty! Please ensure it is added under GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          if [ -z "$ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing or empty! Please ensure it is added under GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "account=$ACCOUNT" >> $GITHUB_OUTPUT
          echo "kv_id=$KV_ID" >> $GITHUB_OUTPUT
          echo "Cloudflare credentials sanitized and validated."

      - name: Resolve KV Namespace ID
        run: |
          TOKEN="${{ steps.creds.outputs.token }}"
          ACCOUNT="${{ steps.creds.outputs.account }}"
          KV_ID="${{ steps.creds.outputs.kv_id }}"

          # If KV ID is not manually provided, auto-discover via Cloudflare API
          if [ -z "$KV_ID" ]; then
            echo "CLOUDFLARE_KV_ID not provided directly, auto-discovering from Cloudflare API..."
            API_RESP=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT}/storage/kv/namespaces?per_page=100" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json")

            echo "API Response: $(echo "$API_RESP" | jq -c '.' 2>/dev/null || echo "$API_RESP")"

            KV_ID=$(echo "$API_RESP" | jq -r 'if .result then (.result[] | select(.title=="DTECH_KV") | .id) else empty end' | head -n 1)
          fi

          if [ -n "$KV_ID" ] && [ "$KV_ID" != "null" ]; then
            echo "Found DTECH_KV Namespace ID: $KV_ID"
            sed -i "s/PLACEHOLDER_KV_ID/$KV_ID/g" wrangler.toml
          else
            if grep -q "PLACEHOLDER_KV_ID" wrangler.toml; then
              echo "::error::Could not resolve DTECH_KV namespace. Please set CLOUDFLARE_KV_ID in your GitHub Secrets/Variables."
              exit 1
            fi
          fi

      - name: Deploy to Cloudflare Workers
        run: |
          echo "=== wrangler.toml ==="
          cat wrangler.toml
          echo "=== Running wrangler deploy ==="
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.creds.outputs.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.creds.outputs.account }}
