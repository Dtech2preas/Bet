name: Generate Marketing Video Walkthroughs

on:
  workflow_dispatch:
    inputs:
      voice:
        description: 'Voiceover Accent / Model'
        required: true
        default: 'en-ZA-LukeNeural'
        type: choice
        options:
          - 'en-ZA-LukeNeural'
          - 'en-ZA-LeahNeural'
          - 'en-US-ChristopherNeural'
          - 'en-US-JennyNeural'
      viewports:
        description: 'Viewports to Record'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'desktop'
          - 'mobile'
  push:
    branches:
      - main
    paths:
      - 'record_walkthrough.py'
      - '.github/workflows/generate_marketing_video.yml'

jobs:
  render-marketing-videos:
    name: Record Desktop & Mobile Videos with Voiceover
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & edge-tts
        run: |
          python -m pip install --upgrade pip
          pip install playwright edge-tts
          playwright install --with-deps chromium

      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version

      - name: Run Automated Recording & Synthesize Voiceover
        run: |
          VOICE="${{ github.event.inputs.voice || 'en-ZA-LukeNeural' }}"
          VIEWPORTS="${{ github.event.inputs.viewports || 'both' }}"
          echo "Starting recording with voice: $VOICE | viewports: $VIEWPORTS"
          python record_walkthrough.py --voice "$VOICE" --viewports "$VIEWPORTS"

      - name: Upload Videos & Screenshots as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dtech-marketing-walkthroughs
          path: |
            output_videos/*.mp4
            output_audio/*.mp3
            screenshots/*.png
          retention-days: 30
